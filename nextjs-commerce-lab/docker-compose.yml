services:
  postgres:
    image: postgres:17-alpine
    container_name: commerce-practice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
      POSTGRES_DB: commerce_lab
    ports:
      - "5432:5432"
    volumes:
      - commerce_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  commerce_postgres_data:
